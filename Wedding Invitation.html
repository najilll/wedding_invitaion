--serif:'Italiana','Didot','Georgia',serif;--sans:'Jost','Helvetica Neue',Arial,sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--ivory);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.7;overflow-x:hidden}
body.lock{overflow:hidden}
h1,h2,h3,p{margin:0}
a{color:inherit}
/* bootstrap-5 style grid helpers (inlined subset) */
.container{width:100%;max-width:1080px;margin:0 auto;padding:0 24px}
.row{display:flex;flex-wrap:wrap;margin:0 -16px}.row>*{padding:0 16px;width:100%}
.align-items-center{align-items:center}.text-center{text-align:center}.d-flex{display:flex}.justify-content-center{justify-content:center}.gap-3{gap:16px}
@media(min-width:768px){.col-md-5{width:41.6667%}.col-md-6{width:50%}.col-md-7{width:58.3333%}}
/* motifs */
.sf,.leaf,.bloom{position:absolute;background-repeat:no-repeat;background-size:contain;pointer-events:none}
.sf{background-image:var(--sf1);transform:rotate(calc(var(--y) * .1deg))}
.sf.b{background-image:var(--sf2);transform:rotate(calc(var(--y) * -.08deg))}
.leaf{background-image:var(--leaf-img);width:clamp(150px,26vw,330px);aspect-ratio:511/700;background-position:top left}
.leaf.br{transform:rotate(180deg)}.leaf.tr{transform:scaleX(-1)}
.ln{display:block;overflow:hidden}.ln>span{display:block;transform:translateY(108%);transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.in .ln>span,.go .ln>span{transform:none}
.fd{opacity:0;transition:opacity 1.4s ease .3s}.in .fd,.go .fd{opacity:1}
.wipe{clip-path:inset(0 0 100% 0);transition:clip-path 1.5s cubic-bezier(.7,0,.2,1)}.in .wipe,.go .wipe{clip-path:inset(0)}
.label{font-size:.85rem;letter-spacing:.14em;color:var(--leaf);font-weight:400}
.title{font-family:var(--serif);font-size:clamp(2rem,5vw,3.2rem);line-height:1.15;font-weight:400}
section{position:relative;overflow:hidden}
/* loader */
.loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;pointer-events:all}
.loader.gone{display:none}
.panel{position:absolute;top:0;bottom:0;width:50.2%;background:var(--ivory);transition:transform 1.1s cubic-bezier(.7,0,.2,1)}
.panel.l{left:0}.panel.r{right:0}
.loader.open .panel.l{transform:translateX(-101%)}.loader.open .panel.r{transform:translateX(101%)}
.core{position:relative;text-align:center;transition:opacity .5s,transform .9s}
.loader.open .core{opacity:0;transform:scale(1.3)}
.core i{display:block;width:clamp(120px,30vw,170px);aspect-ratio:1;margin:0 auto 18px;background:var(--sf1) center/contain no-repeat}
.core b{font-family:var(--serif);font-size:1.4rem;font-weight:400;letter-spacing:.1em}
.core small{display:block;color:var(--mute);margin-top:4px;font-variant-numeric:tabular-nums}
/* top bar + progress */
.bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 24px 14px;font-size:.85rem;letter-spacing:.08em}
.bar a{text-decoration:none;padding:6px 2px}.bar .mono{font-family:var(--serif);font-size:1.3rem;letter-spacing:.06em}
.bar nav{display:flex;gap:22px}
.bar a:focus-visible,.btn:focus-visible{outline:2px solid var(--sun);outline-offset:4px}
.rail{position:fixed;left:0;top:0;width:3px;height:100%;z-index:19;background:transparent}
.rail::after{content:"";position:absolute;left:0;top:0;width:100%;height:calc(var(--p) * 100%);background:var(--sun)}

.hero .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(251,248,241,.78) 0%,rgba(251,248,241,.25) 38%,rgba(251,248,241,0) 55%)}
.hero .txt{position:relative;z-index:2;padding:calc(120px + env(safe-area-inset-top,0px)) 24px 0;width:100%;text-align:center}
.names{font-family:var(--serif);font-size:clamp(3.4rem,15vw,6.6rem);line-height:.95;font-weight:400;margin:14px 0}
.names .amp{display:block;font-size:.4em;color:var(--sun);line-height:1.2}
.ch{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.ch>span{display:inline-block;transform:translateY(110%);transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.go .ch>span{transform:none}
.hero .sf{width:clamp(130px,24vw,260px);aspect-ratio:1;top:-40px;right:-40px;z-index:1}
.hero .leaf{top:0;left:0;z-index:1;opacity:.95}
.cue{position:absolute;bottom:22px;left:50%;z-index:2;width:1px;height:46px;background:linear-gradient(#fff,transparent);overflow:hidden}
.cue::after{content:"";position:absolute;left:0;top:-100%;width:1px;height:100%;background:var(--sun);animation:cue 2s infinite}
@keyframes cue{to{top:100%}}
@media(min-width:768px){
 .hero .ph{left:50%;background-position:center 70%}
 .hero .ph::after{background:linear-gradient(90deg,var(--ivory),rgba(251,248,241,0) 22%)}
 .hero .txt{width:50%;text-align:left;align-self:center;padding:90px 7vw 0 8vw}
 .hero .sf{right:auto;left:calc(50% - 90px);top:auto;bottom:6vh}
 .cue{left:25%}
}

.units{display:flex;gap:clamp(14px,4vw,34px);margin:26px 0 8px}
.unit{min-width:3.2ch}.unit b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(2.6rem,9vw,4rem);line-height:1;font-variant-numeric:tabular-nums}
.unit b span{display:inline-block;animation:tick .6s cubic-bezier(.2,.8,.2,1)}
@keyframes tick{from{transform:translateY(-40%);opacity:0}}
.unit small{font-size:.8rem;color:var(--mute);letter-spacing:.1em}
.track{position:relative;margin:46px 8px 0;height:2px;background:#cfd6c9}
.fill{position:absolute;left:0;top:0;height:100%;background:var(--leaf);transition:width 1.6s cubic-bezier(.3,.8,.2,1) .4s;width:0}
.mk{position:absolute;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--ivory);border:1.5px solid #9aa89a;transform:translateX(-50%)}
.mk.on{background:var(--leaf);border-color:var(--leaf)}
.mk em{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-style:normal;font-size:.74rem;white-space:nowrap;color:var(--mute);text-align:center;line-height:1.3}
.mk em b{display:block;font-weight:500;color:var(--ink);font-size:.9rem}
.rider{position:absolute;top:-15px;width:32px;height:32px;margin-left:-16px;background:var(--sf2) center/contain no-repeat;transition:left 1.6s cubic-bezier(.3,.8,.2,1) .4s;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.closed{font-family:var(--serif);font-size:1.8rem}
/* schedule */
.sched{background:var(--sage);padding:110px 0 120px}
.sched .leaf{right:0;top:0}.sched .leaf.bl{left:0;bottom:0;top:auto;transform:rotate(180deg) scaleX(-1)}
.tl{position:relative;max-width:520px;margin:56px auto 0;padding-left:34px;text-align:left}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--leaf);transform-origin:top;transform:scaleY(0);transition:transform 2s ease}
.tl.in::before{transform:scaleY(1)}
.ev{position:relative;padding-bottom:40px}.ev:last-child{padding-bottom:0}
.ev::before{content:"";position:absolute;left:-34px;top:11px;width:11px;height:11px;border-radius:50%;background:var(--sun)}
.ev time{font-size:.9rem;color:var(--leaf);font-weight:400;letter-spacing:.06em}
.ev h3{font-family:var(--serif);font-size:1.7rem;font-weight:400;line-height:1.2}
.ev p{color:var(--mute)}

.venue::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(24,36,29,.74),rgba(24,36,29,.62))}
.venue .container{position:relative}
.venue .label{color:#F3D58A}
.card{background:var(--ivory);color:var(--ink);max-width:460px;margin:44px auto 0;padding:36px 30px;border-radius:2px;text-align:center;position:relative;overflow:hidden}
.card h3{font-family:var(--serif);font-size:2rem;font-weight:400}
.card p{color:var(--mute)}
.btn{display:inline-block;margin:22px 6px 0;padding:12px 28px;border:1px solid var(--ink);text-decoration:none;font-size:.9rem;letter-spacing:.06em;transition:background .3s,color .3s}

.venue .sf{width:150px;aspect-ratio:1;right:-50px;top:-50px}
footer{padding:80px 24px calc(60px + env(safe-area-inset-bottom,0px));text-align:center;position:relative;overflow:hidden}
footer .names{font-size:clamp(2.2rem,8vw,3.6rem);margin:0 0 12px}
footer .sf{width:120px;aspect-ratio:1;left:50%;margin-left:-60px;top:-60px}
.bloom{width:54px;height:54px;margin:-27px 0 0 -27px;position:fixed;z-index:60;background-image:var(--sf2);animation:bl 1.6s ease-out forwards}
@keyframes bl{from{opacity:1;transform:scale(.3) rotate(0)}to{opacity:0;transform:translateY(-90px) scale(1.2) rotate(160deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}.sf{transform:none}}

  venue:'Sunflower Garden Hall', addr:'MG Road, Ernakulam, Kerala',
  map:'https://www.google.com/maps/search/?api=1&query=Ernakulam+Kerala',
  rsvp:'https://wa.me/910000000000?text=We%E2%80%99ll%20be%20there!'
};

var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function pad(n){return String(n).padStart(2,'0')}

/* scroll -> CSS variables (no re-render) */
function useScrollVars(){
  useEffect(function(){
    var t=false,root=document.documentElement;
    function f(){t=false;var y=window.scrollY,m=document.body.scrollHeight-innerHeight;
      root.style.setProperty('--y',y);root.style.setProperty('--p',m>0?Math.min(1,y/m):0)}
    function on(){if(!t){t=true;requestAnimationFrame(f)}}
    addEventListener('scroll',on,{passive:true});f();
    return function(){removeEventListener('scroll',on)}
  },[]);
}

/* reveal when scrolled into view */
function Reveal(p){
  var r=useRef(null),s=useState(false),on=s[0],set=s[1];
  useEffect(function(){
    var io=new IntersectionObserver(function(e){if(e[0].isIntersecting){set(true);io.disconnect()}},{threshold:p.t||.25});
    io.observe(r.current);return function(){io.disconnect()}
  },[]);
  return h(p.as||'div',{ref:r,className:(p.className||'')+(on?' in':''),style:p.style},p.children);
}
function Ln(p){return h('span',{className:'ln'},h('span',{style:{transitionDelay:(p.d||0)+'s'}},p.children))}

function Loader(p){
  var s=useState(0),n=s[0],setN=s[1],o=useState(false),open=o[0],setOpen=o[1],g=useState(false),gone=g[0],setGone=g[1];
  useEffect(function(){
    var v=0,id=setInterval(function(){
      v=Math.min(100,v+(v<70?3:v<92?1.6:.8));setN(Math.round(v));
      if(v>=100){clearInterval(id);setTimeout(function(){setOpen(true);p.onOpen()},350);setTimeout(function(){setGone(true)},1700)}
    },reduce?5:34);
    return function(){clearInterval(id)}
  },[]);
  return h('div',{className:'loader'+(open?' open':'')+(gone?' gone':''),'aria-hidden':'true'},
    h('div',{className:'panel l'}),h('div',{className:'panel r'}),
    h('div',{className:'core'},
      h('i',{style:{transform:'scale('+(.35+.65*n/100)+') rotate('+(n*3.6)+'deg)'}}),
      h('b',null,C.a[0]+' & '+C.b[0]),h('small',null,n+'%')));
}

function Name(p){
  var base=p.base||0;
  return h('span',{style:{display:'block'},'aria-label':p.t},p.t.split('').map(function(c,i){
    return h('span',{className:'ch','aria-hidden':'true',key:i},h('span',{style:{transitionDelay:(base+i*.07)+'s'}},c))}));
}

function Hero(p){
  return h('section',{className:'hero'+(p.go?' go':''),id:'top'},
    h('div',{className:'ph wipe'}),
    h('div',{className:'leaf'}),h('div',{className:'sf'}),
    h('div',{className:'txt'},
      h('p',{className:'label fd'},'TOGETHER WITH THEIR FAMILIES'),
      h('h1',{className:'names'},h(Name,{t:C.a,base:.6}),h('span',{className:'amp ln'},h('span',{style:{transitionDelay:'1s'}},'&')),h(Name,{t:C.b,base:1.1})),
      h('p',{className:'fd',style:{maxWidth:'22em',margin:'0 auto'}},'invite you to celebrate their wedding'),
      h('p',{className:'fd',style:{marginTop:14,fontWeight:400}},'Saturday, 31 October 2026 · Ernakulam, Kerala')),
    h('div',{className:'cue'}));
}

function useNow(){
  var s=useState(Date.now()),n=s[0],set=s[1];
  useEffect(function(){var id=setInterval(function(){set(Date.now())},1000);return function(){clearInterval(id)}},[]);
  return n;
}

function Countdown(){
  var now=useNow(),end=C.date.getTime(),sent=end-C.days*864e5,left=Math.max(0,end-now),closed=left===0;
  var d=Math.floor(left/864e5),hh=Math.floor(left%864e5/36e5),m=Math.floor(left%36e5/6e4),sec=Math.floor(left%6e4/1e3);
  var pct=Math.min(1,Math.max(0,(now-sent)/(end-sent)));
  var units=[[d,'days'],[hh,'hours'],[m,'minutes'],[sec,'seconds']];
  var marks=[];for(var i=0;i<=C.days;i++){
    var dt=new Date(sent+i*864e5);
    marks.push({i:i,left:i/C.days*100,wd:i===C.days?'Wedding':dt.toLocaleDateString('en-IN',{weekday:'short'}),dd:i===C.days?'day':dt.toLocaleDateString('en-IN',{day:'numeric'})});
  }
  return h('section',{className:'count',id:'countdown'},h('div',{className:'container'},h('div',{className:'row align-items-center'},
    h(Reveal,{className:'col-md-5'},h('div',{className:'arch wipe',role:'img','aria-label':'The couple holding hands by the water'})),
    h(Reveal,{className:'col-md-7',t:.15},
      h('p',{className:'label fd'},closed?'THE INVITATION HAS CLOSED':'THIS INVITATION CLOSES IN'),
      closed?h('p',{className:'closed',style:{margin:'18px 0'}},'Thank you for celebrating with us.')
       :h('div',{className:'units'},units.map(function(u,i){return h('div',{className:'unit',key:i},h('b',null,h('span',{key:u[0]},pad(u[0]))),h('small',null,u[1]))})),
      h('div',{className:'track'},
        h('div',{className:'fill',style:{width:(pct*100)+'%'}}),
        h('div',{className:'rider',style:{left:(pct*100)+'%'}}),
        marks.map(function(k){return h('div',{key:k.i,className:'mk'+(pct>=k.i/C.days-.001?' on':''),style:{left:k.left+'%'}},h('em',null,h('b',null,k.dd),k.wd))})),
      h('div',{style:{height:56}})))));
}

function Schedule(){
  var ev=[['4:00 PM','The ceremony','Please take your seats by 3:45.'],['5:30 PM','Blessings and portraits','Meet the families, and stay for photographs.'],['7:00 PM','Dinner under the lights','Food, music and an open floor.']];
  return h('section',{className:'sched',id:'schedule'},
    h('div',{className:'leaf tr'}),h('div',{className:'leaf bl'}),
    h('div',{className:'container text-center',style:{position:'relative'}},
      h(Reveal,null,h('p',{className:'label fd'},'THE DAY'),h('h2',{className:'title',style:{marginTop:8}},h(Ln,null,'Saturday, 31 October'))),
      h(Reveal,{className:'tl',t:.2},ev.map(function(e,i){
        return h('div',{className:'ev',key:i},h('time',null,e[0]),h('h3',null,e[1]),h('p',null,e[2]))}))));
}

function Band(){
  return h(Reveal,{as:'section',className:'band',t:.3},h('p',{className:'fd'},'Two people, one long walk, and you beside us.'));
}

function Venue(){
  return h('section',{className:'venue',id:'venue'},
    h('div',{className:'container text-center'},
      h(Reveal,null,h('p',{className:'label fd'},'WHERE'),h('h2',{className:'title',style:{marginTop:8}},h(Ln,null,'Join us in Kerala'))),
      h(Reveal,{className:'card wipe',t:.2},h('div',{className:'sf b'}),
        h('h3',null,C.venue),h('p',{style:{marginTop:6}},C.addr),h('p',null,'Ceremony begins at 4:00 PM'),
        h('a',{className:'btn fill-btn',href:C.map,target:'_blank',rel:'noopener'},'Open in Maps'),
        h('a',{className:'btn',href:C.rsvp,target:'_blank',rel:'noopener'},'Reply on WhatsApp'))));
}

function App(){
  var s=useState(false),go=s[0],setGo=s[1];
  useScrollVars();
  useEffect(function(){document.body.classList.toggle('lock',!go)},[go]);
  useEffect(function(){
    var $=window.jQuery;if(!$)return;
    $(document).on('click.nav','a[href^="#"]',function(e){var t=$(this.getAttribute('href'));if(t.length){e.preventDefault();$('html,body').animate({scrollTop:t.offset().top},reduce?0:900)}});
    $(document).on('pointerdown.bloom',function(e){
      if(reduce)return;var b=$('<i class="bloom"></i>').css({left:e.clientX,top:e.clientY}).appendTo('body');setTimeout(function(){b.remove()},1700)});
    return function(){$(document).off('.nav .bloom')};
  },[]);
  return h(React.Fragment,null,
    h(Loader,{onOpen:function(){setGo(true)}}),
    h('div',{className:'rail','aria-hidden':'true'}),
    h('header',{className:'bar'},h('a',{href:'#top',className:'mono'},C.a[0]+' & '+C.b[0]),
      h('nav',null,h('a',{href:'#countdown'},'Countdown'),h('a',{href:'#schedule'},'Day'),h('a',{href:'#venue'},'Venue'))),
    h('main',null,h(Hero,{go:go}),h(Countdown),h(Schedule),h(Band),h(Venue)),
    h('footer',null,h('div',{className:'sf'}),h(Reveal,null,h('p',{className:'names'},h(Ln,null,C.a+' & '+C.b)),h('p',{className:'fd',style:{color:'var(--mute)'}},'With love, and with sunflowers.'))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
